name: Lab Part 1 - GPT2 implementation
on:
  push:
    branches: [edidada/part-1]
  workflow_dispatch:
    inputs:
      full_training:
        type: boolean
        default: false
        description: Run full ten-epoch experiments
      runner_labels:
        type: string
        default: '["ubuntu-latest"]'
        description: JSON runner labels for full training
      accelerator:
        type: choice
        options: [cpu, cuda121]
        default: cpu
        description: PyTorch CPU or CUDA 12.1
      epochs:
        type: number
        default: 10
        description: Full training epochs
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python optimizer_test.py
      - run: python -m pytest tests -q
      - run: python sanity_check.py
  full-training:
    if: github.event_name == 'workflow_dispatch' && inputs.full_training
    strategy:
      fail-fast: false
      matrix:
        mode: [last-linear-layer, full-model]
    runs-on: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install training PyTorch
        shell: bash
        run: |
          if [ "${{ inputs.accelerator }}" = cuda121 ]; then
            pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
          else
            pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          fi
      - run: pip install -r requirements.txt
      - name: Runner hardware
        run: |
          lscpu
          free -h
          python -c "import torch; print('CUDA available:', torch.cuda.is_available())"
      - name: Full SST and CFIMDB training
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          device_flag=""
          if [ "${{ inputs.accelerator }}" = cuda121 ]; then device_flag="--use_gpu"; fi
          lr=1e-3
          if [ "${{ matrix.mode }}" = full-model ]; then lr=1e-5; fi
          python classifier.py --fine-tune-mode "${{ matrix.mode }}" --epochs "${{ inputs.epochs || 10 }}" $device_flag --batch_size 1 --lr "$lr" 2>&1 | tee results/training.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-sentiment-${{ matrix.mode }}
          path: |
            results/
            predictions/
            *.pt
  capacity:
    strategy:
      fail-fast: false
      matrix:
        task: [sst, cfimdb]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Runner hardware
        run: |
          lscpu
          free -h
          python -c "import torch; print('CUDA available:', torch.cuda.is_available())"
      - run: python scripts/capacity_probe.py --task "${{ matrix.task }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-${{ matrix.task }}
          path: results/
